    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fff; 
            text-align: center; 
            padding: 60px 20px; 
            color: #333;
        }

        h1 { 
            color: #8B0000; /* زرشکی */
            font-size: 36px;

            gap: 12px;
            padding: 15px 30px; 
            background-color: #8B0000; /* زرشکی */
            color: #fff; 
            text-decoration: none; 
            border-radius: 12px;

            width: 250px;
            text-align: center;
        }

        .links a:hover { 
            background-color: #a60000; 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(139,0,0,0.4);
        }

        footer { 
            margin-top: 50px; 
            color: #8B0000; 
            font-size: 14px; 
        }

        /* Responsive */
        @media (max-width: 500px) {
            h1 { font-size: 28px; }
